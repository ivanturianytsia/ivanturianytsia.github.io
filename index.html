<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ivan Turianytsia</title>
    <meta name="description" content="Ivan Turianytsia. Engineering at Forgent, ex-Stripe. Based in Berlin" />
    <meta name="author" content="Ivan Turianytsia" />
    <link rel="canonical" href="https://turianytsia.com/" />
    <link rel="me" href="https://www.linkedin.com/in/ivan-turianytsia-6a707a100/" />
    <meta name="color-scheme" content="dark" />

    <!-- Link previews (Slack, LinkedIn, iMessage, X, WhatsApp). Every URL here
         must be absolute: unfurlers do not resolve relative paths, and the
         page's own base is './'. og-image.jpg lives in public/ so its URL is
         stable rather than content-hashed. Unfurls are cached for days; after
         changing these, re-check with LinkedIn's Post Inspector. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Ivan Turianytsia" />
    <meta property="og:url" content="https://turianytsia.com/" />
    <meta property="og:title" content="Ivan Turianytsia" />
    <meta property="og:description" content="Ivan Turianytsia. Engineering at Forgent, ex-Stripe. Based in Berlin" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://turianytsia.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Berlin's TV tower against an orange dusk sky" />
    <meta property="profile:first_name" content="Ivan" />
    <meta property="profile:last_name" content="Turianytsia" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ivan Turianytsia" />
    <meta name="twitter:description" content="Ivan Turianytsia. Engineering at Forgent, ex-Stripe. Based in Berlin" />
    <meta name="twitter:image" content="https://turianytsia.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Berlin's TV tower against an orange dusk sky" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "url": "https://turianytsia.com/",
        "mainEntity": {
          "@type": "Person",
          "name": "Ivan Turianytsia",
          "jobTitle": "Software Engineer",
          "worksFor": { "@type": "Organization", "name": "Forgent", "url": "https://forgent.ai" },
          "url": "https://turianytsia.com/",
          "image": "https://turianytsia.com/og-image.jpg",
          "address": { "@type": "PostalAddress", "addressLocality": "Berlin", "addressCountry": "DE" },
          "sameAs": ["https://www.linkedin.com/in/ivan-turianytsia-6a707a100/"]
        }
      }
    </script>

    <!-- Carried over from the previous site, unchanged. These live in public/
         so they are copied to the site root verbatim, which is where the
         absolute paths below and in site.webmanifest expect to find them. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0d10" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The page is otherwise a bare canvas: this gives screen readers and
         crawlers that skip WebGL a heading and a sentence to go on. -->
    <header class="visually-hidden">
      <h1>Ivan Turianytsia</h1>
      <p>Engineering at Forgent, ex-Stripe. Based in Berlin</p>
    </header>

    <canvas id="stage" role="img" aria-label="A 3D room with a window looking out over Berlin at dusk"></canvas>

    <!-- Removed from the DOM by src/loading.ts once the fade completes. -->
    <div id="loading" role="progressbar" aria-label="Loading room">
      <div id="loading-track"><div id="loading-bar"></div></div>
    </div>

    <p id="hint" aria-live="polite">Drag to look around</p>

    <!-- Shown by src/farewell.ts on exit intent. A native <dialog> so it gets
         modal focus trapping and Esc-to-close without any of that being
         hand-rolled. -->
    <dialog id="farewell" aria-labelledby="farewell-title">
      <h2 id="farewell-title">Let's connect</h2>
      <p>Thank you for your visit.</p>
      <a id="farewell-link" href="#" target="_blank" rel="noopener noreferrer">Go to Ivan's LinkedIn</a>
      <button id="farewell-close" type="button">Maybe later</button>
    </dialog>

    <noscript>
      <p class="fallback">This room is rendered with WebGL and needs JavaScript enabled.</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
